<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>projector — favicon riffs, round 2</title>
<style>
  body { margin: 0; font-family: ui-sans-serif, system-ui, sans-serif; background: #f4f5f7; color: #111; }
  h1 { font-size: 18px; margin: 0; padding: 20px 24px 4px; }
  .sub { padding: 0 24px 16px; font-size: 13px; opacity: 0.6; }
  .section-label { padding: 14px 24px 6px; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; opacity: 0.5; }
  .row { display: flex; align-items: center; gap: 28px; padding: 18px 24px; border-bottom: 1px solid #e2e4e8; }
  .row.ref { opacity: 0.55; }
  .dark .row { border-bottom-color: #26292f; }
  .dark { background: #16181d; color: #eee; }
  .meta { width: 300px; }
  .name { font-size: 13px; font-weight: 600; }
  .note { font-size: 12px; opacity: 0.65; margin-top: 3px; line-height: 1.45; }
  .sizes { display: flex; align-items: center; gap: 22px; }
  .sizes img { display: block; }
  .tab { display: flex; align-items: center; gap: 7px; background: #fff; border: 1px solid #d6d9de;
         border-radius: 8px 8px 0 0; padding: 6px 14px 6px 10px; font-size: 12px; width: 120px; }
  .dark .tab { background: #2b2e35; border-color: #3a3e46; color: #ddd; }
</style>
</head>
<body>
<h1>projector — favicon riffs, round 2</h1>
<div class="sub">Riffs on #1 (beam-spread) and #2 (prism). Originals shown dimmed for reference. 64 / 32 / 16&nbsp;px + mock tab.</div>
<div id="light"></div>
<div id="dark" class="dark"></div>

<script>
const riffs = [
  {
    name: "1 · beam-spread (original)", ref: true,
    note: "For reference.",
    svg: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="#0E1116"/><polygon points="26,32 56,8 56,17.6" fill="#FF4D6D"/><polygon points="26,32 56,17.6 56,27.2" fill="#FFC53D"/><polygon points="26,32 56,27.2 56,36.8" fill="#3DDC97"/><polygon points="26,32 56,36.8 56,46.4" fill="#4D9FFF"/><polygon points="26,32 56,46.4 56,56" fill="#A78BFA"/><rect x="6" y="29" width="22" height="6" rx="3" fill="#FFFFFF"/></svg>`
  },
  {
    name: "1a · taper-beam",
    note: "Incoming white light starts broad at the left edge and tapers into the focal point, then disperses.",
    svg: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="#0E1116"/><polygon points="26,32 56,8 56,17.6" fill="#FF4D6D"/><polygon points="26,32 56,17.6 56,27.2" fill="#FFC53D"/><polygon points="26,32 56,27.2 56,36.8" fill="#3DDC97"/><polygon points="26,32 56,36.8 56,46.4" fill="#4D9FFF"/><polygon points="26,32 56,46.4 56,56" fill="#A78BFA"/><polygon points="5,24 27,30.4 27,33.6 5,40" fill="#FFFFFF"/></svg>`
  },
  {
    name: "1b · bowtie",
    note: "Full symmetry: white cone converging to a pinch point, rainbow cone expanding out. Small white dot at the waist.",
    svg: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="#0E1116"/><polygon points="32,32 58,8 58,17.6" fill="#FF4D6D"/><polygon points="32,32 58,17.6 58,27.2" fill="#FFC53D"/><polygon points="32,32 58,27.2 58,36.8" fill="#3DDC97"/><polygon points="32,32 58,36.8 58,46.4" fill="#4D9FFF"/><polygon points="32,32 58,46.4 58,56" fill="#A78BFA"/><polygon points="6,10 32,30.5 32,33.5 6,54" fill="#FFFFFF"/><circle cx="32" cy="32" r="3" fill="#FFFFFF"/></svg>`
  },
  {
    name: "1c · taper-rays",
    note: "Tapered beam in, but the spectrum splits into five separated rays with gaps.",
    svg: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="#0E1116"/><polygon points="26,32 56,8 56,15.6" fill="#FF4D6D"/><polygon points="26,32 56,18.1 56,25.7" fill="#FFC53D"/><polygon points="26,32 56,28.2 56,35.8" fill="#3DDC97"/><polygon points="26,32 56,38.3 56,45.9" fill="#4D9FFF"/><polygon points="26,32 56,48.4 56,56" fill="#A78BFA"/><polygon points="5,24 27,30.4 27,33.6 5,40" fill="#FFFFFF"/></svg>`
  },
  {
    name: "2 · prism (original)", ref: true,
    note: "For reference.",
    svg: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="#0E1116"/><polygon points="40,31 60,12 60,20.4" fill="#FF4D6D"/><polygon points="40,31 60,20.4 60,28.8" fill="#FFC53D"/><polygon points="40,31 60,28.8 60,37.2" fill="#3DDC97"/><polygon points="40,31 60,37.2 60,45.6" fill="#4D9FFF"/><polygon points="40,31 60,45.6 60,54" fill="#A78BFA"/><rect x="2" y="28.5" width="23" height="5" rx="2.5" fill="#FFFFFF"/><polygon points="32,12 15,48 49,48" fill="#1B2230" stroke="#E8ECF2" stroke-width="3" stroke-linejoin="round"/></svg>`
  },
  {
    name: "2a · dsotm",
    note: "Classic diagonal composition: beam enters high from the left, spectrum exits low to the right. Bolder stroke.",
    svg: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="#0E1116"/><polygon points="41,29 58,22 58,28.8" fill="#FF4D6D"/><polygon points="41,29 58,28.8 58,35.6" fill="#FFC53D"/><polygon points="41,29 58,35.6 58,42.4" fill="#3DDC97"/><polygon points="41,29 58,42.4 58,49.2" fill="#4D9FFF"/><polygon points="41,29 58,49.2 58,56" fill="#A78BFA"/><line x1="4" y1="22" x2="23" y2="31" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/><polygon points="32,10 12,50 52,50" fill="#1B2230" stroke="#E8ECF2" stroke-width="3.5" stroke-linejoin="round"/></svg>`
  },
  {
    name: "2b · solid-prism",
    note: "Prism as a solid white shape instead of an outline — maximum contrast at 16px.",
    svg: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="#0E1116"/><polygon points="38,31 60,12 60,20.4" fill="#FF4D6D"/><polygon points="38,31 60,20.4 60,28.8" fill="#FFC53D"/><polygon points="38,31 60,28.8 60,37.2" fill="#3DDC97"/><polygon points="38,31 60,37.2 60,45.6" fill="#4D9FFF"/><polygon points="38,31 60,45.6 60,54" fill="#A78BFA"/><rect x="2" y="28.5" width="20" height="5" rx="2.5" fill="#FFFFFF"/><polygon points="32,12 15,48 49,48" fill="#F2F4F8"/></svg>`
  },
  {
    name: "2c · taper-prism",
    note: "The tapered incoming beam from 1a, feeding the outlined prism.",
    svg: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="#0E1116"/><polygon points="40,31 60,12 60,20.4" fill="#FF4D6D"/><polygon points="40,31 60,20.4 60,28.8" fill="#FFC53D"/><polygon points="40,31 60,28.8 60,37.2" fill="#3DDC97"/><polygon points="40,31 60,37.2 60,45.6" fill="#4D9FFF"/><polygon points="40,31 60,45.6 60,54" fill="#A78BFA"/><polygon points="2,20 24,29 24,33 2,42" fill="#FFFFFF"/><polygon points="32,12 15,48 49,48" fill="#1B2230" stroke="#E8ECF2" stroke-width="3" stroke-linejoin="round"/></svg>`
  }
];

function render(containerId) {
  const el = document.getElementById(containerId);
  el.insertAdjacentHTML("beforeend",
    `<div class="section-label">${containerId} page</div>`);
  for (const r of riffs) {
    const src = "data:image/svg+xml," + encodeURIComponent(r.svg);
    el.insertAdjacentHTML("beforeend", `
      <div class="row${r.ref ? " ref" : ""}">
        <div class="meta">
          <div class="name">${r.name}</div>
          <div class="note">${r.note}</div>
        </div>
        <div class="sizes">
          <img src="${src}" width="64" height="64">
          <img src="${src}" width="32" height="32">
          <img src="${src}" width="16" height="16">
          <div class="tab"><img src="${src}" width="16" height="16"><span>projector</span></div>
        </div>
      </div>`);
  }
}
render("light");
render("dark");
</script>
</body>
</html>
