<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>projector — favicon riffs, round 6</title>
<style>
  body { margin: 0; font-family: ui-sans-serif, system-ui, sans-serif; background: #f4f5f7; color: #111; }
  h1 { font-size: 18px; margin: 0; padding: 20px 24px 4px; }
  .sub { padding: 0 24px 16px; font-size: 13px; opacity: 0.6; }
  .section-label { padding: 14px 24px 6px; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; opacity: 0.5; }
  .row { display: flex; align-items: center; gap: 28px; padding: 18px 24px; border-bottom: 1px solid #e2e4e8; }
  .row.ref { opacity: 0.55; }
  .dark .row { border-bottom-color: #26292f; }
  .dark { background: #16181d; color: #eee; }
  .meta { width: 300px; }
  .name { font-size: 13px; font-weight: 600; }
  .note { font-size: 12px; opacity: 0.65; margin-top: 3px; line-height: 1.45; }
  .sizes { display: flex; align-items: center; gap: 22px; }
  .sizes img { display: block; }
  .tab { display: flex; align-items: center; gap: 7px; background: #fff; border: 1px solid #d6d9de;
         border-radius: 8px 8px 0 0; padding: 6px 14px 6px 10px; font-size: 12px; width: 120px; }
  .dark .tab { background: #2b2e35; border-color: #3a3e46; color: #ddd; }
</style>
</head>
<body>
<h1>projector — favicon riffs, round 6</h1>
<div class="sub">Riffs on 2a4 (corner prism): solid fill, rotations, and squircle emitters. 2a4 dimmed for reference.</div>
<div id="light"></div>
<div id="dark" class="dark"></div>

<script>
const riffs = [
  {
    name: "2a4 · corner (prev)", ref: true,
    note: "For reference.",
    svg: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="#0E1116"/><polygon points="21,16 58,16 58,24" fill="#FF4D6D"/><polygon points="21,16 58,24 58,32" fill="#FFC53D"/><polygon points="21,16 58,32 58,40" fill="#3DDC97"/><polygon points="21,16 58,40 58,48" fill="#4D9FFF"/><polygon points="21,16 58,48 58,56" fill="#A78BFA"/><polygon points="17,7 7,27 27,27" fill="#1B2230" stroke="#E8ECF2" stroke-width="3" stroke-linejoin="round"/></svg>`
  },
  {
    name: "2a4b · solid",
    note: "Same geometry, triangle filled solid white. Strongest contrast at 16px.",
    svg: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="#0E1116"/><polygon points="21,16 58,16 58,24" fill="#FF4D6D"/><polygon points="21,16 58,24 58,32" fill="#FFC53D"/><polygon points="21,16 58,32 58,40" fill="#3DDC97"/><polygon points="21,16 58,40 58,48" fill="#4D9FFF"/><polygon points="21,16 58,48 58,56" fill="#A78BFA"/><polygon points="17,7 7,27 27,27" fill="#F2F4F8" stroke="#F2F4F8" stroke-width="3" stroke-linejoin="round"/></svg>`
  },
  {
    name: "2a4c · apex-out",
    note: "Triangle rotated 45° so the apex points down-right at the fan — arrowhead firing the spectrum.",
    svg: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="#0E1116"/><polygon points="26,26 58,18 58,25.6" fill="#FF4D6D"/><polygon points="26,26 58,25.6 58,33.2" fill="#FFC53D"/><polygon points="26,26 58,33.2 58,40.8" fill="#3DDC97"/><polygon points="26,26 58,40.8 58,48.4" fill="#4D9FFF"/><polygon points="26,26 58,48.4 58,56" fill="#A78BFA"/><polygon points="27,27 21.5,4.5 4.5,21.5" fill="#1B2230" stroke="#E8ECF2" stroke-width="3" stroke-linejoin="round"/></svg>`
  },
  {
    name: "2a4d · apex-in",
    note: "Triangle rotated so the apex tucks into the corner and the flat face emits the fan.",
    svg: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="#0E1116"/><polygon points="19,19 58,16 58,24" fill="#FF4D6D"/><polygon points="19,19 58,24 58,32" fill="#FFC53D"/><polygon points="19,19 58,32 58,40" fill="#3DDC97"/><polygon points="19,19 58,40 58,48" fill="#4D9FFF"/><polygon points="19,19 58,48 58,56" fill="#A78BFA"/><polygon points="8,8 28,12 12,28" fill="#1B2230" stroke="#E8ECF2" stroke-width="3" stroke-linejoin="round"/></svg>`
  },
  {
    name: "2a4e · squircle",
    note: "Squircle emitter instead of a prism — outlined, matching 2a4's style.",
    svg: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="#0E1116"/><polygon points="23,23 58,16 58,24" fill="#FF4D6D"/><polygon points="23,23 58,24 58,32" fill="#FFC53D"/><polygon points="23,23 58,32 58,40" fill="#3DDC97"/><polygon points="23,23 58,40 58,48" fill="#4D9FFF"/><polygon points="23,23 58,48 58,56" fill="#A78BFA"/><rect x="7" y="7" width="20" height="20" rx="7.5" fill="#1B2230" stroke="#E8ECF2" stroke-width="3"/></svg>`
  },
  {
    name: "2a4f · squircle-solid",
    note: "Solid white squircle — echoes the app-icon shape itself, maximum contrast.",
    svg: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="#0E1116"/><polygon points="23,23 58,16 58,24" fill="#FF4D6D"/><polygon points="23,23 58,24 58,32" fill="#FFC53D"/><polygon points="23,23 58,32 58,40" fill="#3DDC97"/><polygon points="23,23 58,40 58,48" fill="#4D9FFF"/><polygon points="23,23 58,48 58,56" fill="#A78BFA"/><rect x="6" y="6" width="21" height="21" rx="8" fill="#F2F4F8"/></svg>`
  }
];

function render(containerId) {
  const el = document.getElementById(containerId);
  el.insertAdjacentHTML("beforeend",
    `<div class="section-label">${containerId} page</div>`);
  for (const r of riffs) {
    const src = "data:image/svg+xml," + encodeURIComponent(r.svg);
    el.insertAdjacentHTML("beforeend", `
      <div class="row${r.ref ? " ref" : ""}">
        <div class="meta">
          <div class="name">${r.name}</div>
          <div class="note">${r.note}</div>
        </div>
        <div class="sizes">
          <img src="${src}" width="64" height="64">
          <img src="${src}" width="32" height="32">
          <img src="${src}" width="16" height="16">
          <div class="tab"><img src="${src}" width="16" height="16"><span>projector</span></div>
        </div>
      </div>`);
  }
}
render("light");
render("dark");
</script>
</body>
</html>
