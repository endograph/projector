<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>projector — ray/wash variants side by side</title>
<style>
  /* Scratch tooling. Stacked rows by default, NOT columns: the ray switches to
     horizontal mode under 1150px, so splitting the width would show every pane
     the wrong mode. Rows keep each pane at the real page width and trade
     height instead — which is fine, because the ray only needs the top ~600px
     of the page to be judged. Columns are one click away for testing the
     narrow-viewport mode on purpose. */
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #141414;
    color: #eee;
    font: 12px ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  header {
    position: sticky;
    top: 0;
    z-index: 5;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
    padding: 8px 12px;
    background: #141414;
    border-bottom: 1px solid #2a2a2a;
  }
  header .sp { flex: 1 }
  label { display: inline-flex; gap: 5px; align-items: center; color: #bbb; cursor: pointer; }
  button, select {
    background: #222;
    color: #eee;
    border: 1px solid #383838;
    border-radius: 6px;
    padding: 4px 8px;
    font: inherit;
    cursor: pointer;
  }
  #panes { display: grid; gap: 1px; background: #2a2a2a; }
  #panes.cols { grid-auto-flow: column; grid-auto-columns: 1fr; height: calc(100vh - 39px); }
  /* Clears the sticky header when a pane is scrolled to. */
  .pane { position: relative; background: #000; min-height: 0; scroll-margin-top: 40px; }
  .pane iframe { display: block; width: 100%; height: 100%; border: 0; }
  .tag {
    position: absolute;
    left: 0;
    top: 0;
    z-index: 2;
    padding: 3px 8px;
    background: rgba(20,20,20,0.85);
    border-bottom-right-radius: 6px;
    color: #fff;
    pointer-events: none;
  }
  .tag b { color: #9ecbff; font-weight: 600; }
  .tag span { color: #999; }
</style>
</head>
<body>

<header>
  <label>rows <input type="range" id="h" min="360" max="1000" value="620" step="20"></label>
  <label><input type="checkbox" id="cols"> columns (tests narrow mode)</label>
  <label>theme
    <select id="theme">
      <option value="">system</option>
      <option value="light" selected>light</option>
      <option value="dark">dark</option>
    </select>
  </label>
  <span class="sp"></span>
  <button id="prev" title="Previous variant (k / p / ↑)">◀</button>
  <span id="at" style="min-width:15ch;text-align:center;color:#9ecbff">a · live</span>
  <button id="next" title="Next variant (j / n / ↓ / space)">▶</button>
  <button id="sync">sync scroll: on</button>
  <button id="reload">reload all</button>
</header>

<div id="panes"></div>

<script type="module">
  import { VARIANTS } from './variants.js'

  const panes = document.getElementById('panes')
  const hEl = document.getElementById('h')
  const colsEl = document.getElementById('cols')
  const themeEl = document.getElementById('theme')
  const syncEl = document.getElementById('sync')
  let syncing = true

  function build() {
    panes.textContent = ''
    for (const v of VARIANTS) {
      const pane = document.createElement('div')
      pane.className = 'pane'
      pane.style.height = colsEl.checked ? '' : hEl.value + 'px'
      pane.innerHTML =
        `<div class="tag"><b>${v.id}</b> ${v.label} <span>${v.note}</span></div>` +
        `<iframe src="./index.html?bare=1&variant=${v.id}" title="${v.label}"></iframe>`
      panes.append(pane)
    }
    panes.classList.toggle('cols', colsEl.checked)
    wire()
  }

  // ---- pane navigation ------------------------------------------------------

  const atEl = document.getElementById('at')
  let at = 0

  /** Which pane owns the top of the viewport (the left edge, in columns mode). */
  function current() {
    const edge = colsEl.checked ? 0 : 48
    const list = [...panes.children]
    let i = 0
    list.forEach((p, n) => {
      const r = p.getBoundingClientRect()
      const start = colsEl.checked ? r.left : r.top
      if (start <= edge + 1) i = n
    })
    return i
  }

  function paintAt(i = current()) {
    at = i
    const v = VARIANTS[i]
    atEl.textContent = `${v.id} · ${v.label}`
  }

  function go(delta) {
    const i = Math.min(Math.max(at + delta, 0), VARIANTS.length - 1)
    const pane = panes.children[i]
    if (!pane) return
    pane.scrollIntoView({ behavior: 'smooth', block: 'start', inline: 'start' })
    paintAt(i)
  }

  /** Digits jump straight to a variant; j/k, n/p, arrows, space step. Ignored
   *  while a form control has focus, so the slider keeps its own arrow keys. */
  function onKey(e) {
    const t = e.target
    if (t && /^(INPUT|SELECT|TEXTAREA)$/.test(t.tagName)) return
    if (e.metaKey || e.ctrlKey || e.altKey) return
    const d = e.key >= '1' && e.key <= String(VARIANTS.length) ? Number(e.key) - 1 : null
    if (d !== null) {
      e.preventDefault()
      go(d - at)
    } else if (['j', 'n', 'ArrowDown', 'ArrowRight', ' '].includes(e.key)) {
      e.preventDefault()
      go(1)
    } else if (['k', 'p', 'ArrowUp', 'ArrowLeft'].includes(e.key)) {
      e.preventDefault()
      go(-1)
    }
  }

  addEventListener('keydown', onKey)
  addEventListener('scroll', () => paintAt(), { passive: true })
  document.getElementById('next').addEventListener('click', () => go(1))
  document.getElementById('prev').addEventListener('click', () => go(-1))

  /** Same-origin frames, so their theme and scroll can be driven from here. */
  function wire() {
    for (const f of panes.querySelectorAll('iframe')) {
      f.addEventListener('load', () => {
        const doc = f.contentDocument
        if (themeEl.value) doc.documentElement.dataset.theme = themeEl.value
        else delete doc.documentElement.dataset.theme
        // Keys pressed over a frame go to *its* document and never reach ours.
        doc.addEventListener('keydown', onKey)
        f.contentWindow.addEventListener('scroll', () => {
          if (!syncing) return
          syncing = false   // re-entrancy guard: our own writes fire scroll too
          const y = f.contentWindow.scrollY
          for (const o of panes.querySelectorAll('iframe')) {
            if (o !== f && o.contentWindow) o.contentWindow.scrollTo(0, y)
          }
          requestAnimationFrame(() => { syncing = true })
        }, { passive: true })
      })
    }
  }

  hEl.addEventListener('input', () => {
    if (colsEl.checked) return
    for (const p of panes.children) p.style.height = hEl.value + 'px'
  })
  colsEl.addEventListener('change', build)
  themeEl.addEventListener('change', () => {
    for (const f of panes.querySelectorAll('iframe')) {
      const doc = f.contentDocument
      if (!doc) continue
      if (themeEl.value) doc.documentElement.dataset.theme = themeEl.value
      else delete doc.documentElement.dataset.theme
    }
  })
  syncEl.addEventListener('click', () => {
    syncing = !syncing
    syncEl.textContent = `sync scroll: ${syncing ? 'on' : 'off'}`
  })
  document.getElementById('reload').addEventListener('click', build)

  build()
  paintAt(0)
</script>
</body>
</html>
